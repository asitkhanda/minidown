name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass (NSGlassEffectView, .glassEffect) needs the macOS 26 SDK to *compile*. The
      # `#available(macOS 26.0, *)` guards in LiquidGlass.swift are runtime checks — they do not
      # make the symbols resolve against an older SDK. Pick the newest Xcode and fail here with a
      # readable message rather than 10 minutes later with "cannot find 'NSGlassEffectView'".
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $SDK is too old — Liquid Glass needs the macOS 26 SDK (Xcode 26+)."
            exit 1
          fi

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Minidown/Minidown.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate project
        working-directory: Minidown
        run: xcodegen generate

      # The .xcodeproj is committed *and* generated. Without this guard a stale one can never be
      # detected — and Package.resolved lives inside it, which is the only thing pinning
      # swift-cmark (swift-markdown depends on it by branch).
      - name: Check generated project is up to date
        run: git diff --exit-code -- Minidown/Minidown.xcodeproj/project.pbxproj

      - name: Build & test
        working-directory: Minidown
        run: |
          xcodebuild \
            -scheme Minidown \
            -destination 'platform=macOS' \
            -derivedDataPath ../DerivedData \
            -resultBundlePath ../TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  bundle:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass (NSGlassEffectView, .glassEffect) needs the macOS 26 SDK to *compile*. The
      # `#available(macOS 26.0, *)` guards in LiquidGlass.swift are runtime checks — they do not
      # make the symbols resolve against an older SDK. Pick the newest Xcode and fail here with a
      # readable message rather than 10 minutes later with "cannot find 'NSGlassEffectView'".
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $SDK is too old — Liquid Glass needs the macOS 26 SDK (Xcode 26+)."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: Minidown
        run: xcodegen generate

      # Unsigned: there is no DEVELOPMENT_TEAM in the project, so an ordinary `archive` fails with
      # "Signing for 'Minidown' requires a development team". The artifact is for inspection, not
      # distribution — Gatekeeper will refuse to run it until signing and notarization exist.
      - name: Archive (unsigned)
        working-directory: Minidown
        run: |
          xcodebuild \
            -scheme Minidown \
            -destination 'platform=macOS' \
            -derivedDataPath ../DerivedData \
            -archivePath ../Minidown.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - uses: actions/upload-artifact@v4
        with:
          name: minidown-macos-archive
          path: Minidown.xcarchive
