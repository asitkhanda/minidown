name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Generate project
        working-directory: Minidown
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build & test
        working-directory: Minidown
        run: |
          xcodebuild \
            -scheme Minidown \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedData \
            build test

  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Generate project
        working-directory: Minidown
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive
        working-directory: Minidown
        run: |
          xcodebuild \
            -scheme Minidown \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedData \
            -archivePath ./DerivedData/Minidown.xcarchive \
            archive
      - uses: actions/upload-artifact@v4
        with:
          name: minidown-macos-archive
          path: Minidown/DerivedData/Minidown.xcarchive
