<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>minidown</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="titlebar" data-tauri-drag-region></div>
    <main id="editor"></main>
    <footer id="status">
      <span id="status-file">Untitled</span>
      <div id="status-tools">
        <button id="btn-focus" class="status-btn" title="Focus mode (⌘D)">
          Focus
        </button>
        <button
          id="btn-typewriter"
          class="status-btn"
          title="Typewriter scrolling (⌥⌘T)"
        >
          Typewriter
        </button>
        <button
          id="btn-export"
          class="status-btn"
          title="Export as HTML (⇧⌘E)"
        >
          Export
        </button>
        <button
          id="status-words"
          class="status-btn"
          title="Words · characters · reading time"
        >
          0 words
        </button>
      </div>
    </footer>
  </body>
</html>
